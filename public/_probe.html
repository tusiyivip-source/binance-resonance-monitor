<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>浏览器直连币安能力探测</title>
<style>body{background:#0a0f16;color:#e6edf5;font:13px/1.7 monospace;padding:16px}
b{color:#38bdf8} .ok{color:#0ecb81} .bad{color:#f6465d} .warn{color:#f0b90b}</style>
</head>
<body>
<h3>浏览器直连币安能力探测</h3>
<pre id="out">运行中…</pre>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += '\n' + s; };
out.textContent = 'origin = ' + location.origin;
const R = { rest: {}, ws: {} };

/* ---------- 1) REST ---------- */
async function rest(name, url) {
  const t0 = performance.now();
  try {
    const r = await fetch(url);
    const txt = await r.text();
    let n = 0, sample = '';
    try { const j = JSON.parse(txt); n = Array.isArray(j) ? j.length : Object.keys(j).length;
      sample = JSON.stringify(Array.isArray(j) ? j[0] : j).slice(0, 110); } catch { }
    R.rest[name] = { ok: r.ok, status: r.status, ms: Math.round(performance.now() - t0), n, sample,
      acao: r.headers.get('access-control-allow-origin') };
    log(`${r.ok ? '✓' : '✗'} REST ${name}  HTTP ${r.status}  ${R.rest[name].ms}ms  ${n} 条  ACAO=${R.rest[name].acao}`);
  } catch (e) {
    R.rest[name] = { ok: false, err: e.message };
    log(`✗ REST ${name}  失败: ${e.message}`);
  }
}

/* ---------- 2) WebSocket ---------- */
function wsTest(name, url, subs, waitMs) {
  return new Promise(resolve => {
    const t0 = performance.now();
    const rec = { msgs: 0, bytes: 0, subAck: null, errors: [], opened: false, sample: null, firstDataMs: null };
    let ws;
    try { ws = new WebSocket(url); } catch (e) { rec.errors.push('ctor: ' + e.message); R.ws[name] = rec; log(`✗ WS ${name} 构造失败`); return resolve(); }
    const done = () => {
      try { ws.close(); } catch { }
      rec.ms = Math.round(performance.now() - t0);
      R.ws[name] = rec;
      const verdict = rec.msgs > 0 ? '✓' : (rec.opened ? '✗ 连上了但零数据帧' : '✗ 连不上');
      log(`${verdict} WS ${name}  opened=${rec.opened} 帧数=${rec.msgs} 字节=${rec.bytes} `
        + `首帧=${rec.firstDataMs ?? '—'}ms  错误=${rec.errors.join(';') || '无'}`);
      resolve();
    };
    const timer = setTimeout(done, waitMs);
    ws.onopen = () => {
      rec.opened = true;
      try { ws.send(JSON.stringify({ method: 'SUBSCRIBE', params: subs, id: 1 })); } catch (e) { rec.errors.push('send: ' + e.message); }
    };
    ws.onmessage = ev => {
      if (rec.msgs === 0) rec.firstDataMs = Math.round(performance.now() - t0);
      rec.msgs++;
      rec.bytes += (ev.data || '').length;
      if (rec.msgs === 1) {
        rec.sample = String(ev.data).slice(0, 140);
        // 判断是订阅回执还是真数据
        if (String(ev.data).includes('"result"') && String(ev.data).includes('"id"')) rec.subAck = String(ev.data);
      }
    };
    ws.onerror = () => rec.errors.push('onerror');
    ws.onclose = e => { rec.errors.push('close ' + e.code); if (!rec.msgs) { clearTimeout(timer); done(); } };
  });
}

(async () => {
  log('\n—— REST ——');
  await rest('fapi/klines', 'https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=15m&limit=3');
  await rest('fapi/ticker24hr', 'https://fapi.binance.com/fapi/v1/ticker/24hr');
  await rest('fapi/exchangeInfo', 'https://fapi.binance.com/fapi/v1/exchangeInfo');

  log('\n—— WebSocket（各等 9 秒）——');
  await wsTest('fstream !bookTicker', 'wss://fstream.binance.com/ws', ['!bookTicker'], 9000);
  await wsTest('fstream kline_1m', 'wss://fstream.binance.com/ws', ['btcusdt@kline_1m'], 9000);
  await wsTest('fstream combined', 'wss://fstream.binance.com/stream?streams=btcusdt@kline_1m/btcusdt@bookTicker', [], 9000);
  await wsTest('fstream markPrice', 'wss://fstream.binance.com/ws', ['btcusdt@markPrice@1s'], 9000);

  log('\n—— 完成 ——');
  window.__PROBE__ = R;
})();
</script>
</body>
</html>
